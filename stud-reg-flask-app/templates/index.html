<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            height: 100vh;
        }

        .form-card {
            max-width: 550px;
            margin: auto;
            margin-top: 60px;
            padding: 30px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .title {
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
        }

        .btn-submit {
            background: #0d6efd;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-weight: 500;
        }

        .btn-submit:hover {
            background: #0b5ed7;
        }

        .footer-link {
            text-align: center;
            margin-top: 15px;
        }

        .footer-link a {
            text-decoration: none;
            color: #198754;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="form-card">

    <h3 class="title">🎓 Student Registration Form</h3>

    <form action="/register" method="POST">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Enter full name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="Enter email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" name="phone" class="form-control" placeholder="Enter phone number" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Course</label>
            <input type="text" name="course" class="form-control" placeholder="Enter course name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-control" rows="3" placeholder="Enter address"></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-submit">
            Register Student
        </button>

    </form>

    <div class="footer-link">
        <a href="/students">📋 View Registered Students</a>
    </div>

</div>

</body>
</html>
